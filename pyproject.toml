[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdwiki"
version = "1.3.0"
description = "A folder-local CLI that turns any directory of markdown into an LLM-maintained wiki (Karpathy llm-wiki pattern)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Benjamin Gross", email = "ben@mintyliving.com"}
]
keywords = [
    "markdown",
    "wiki",
    "llm",
    "knowledge-base",
    "ai-workflow",
    "claude",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.25.0",
    "markdown-it-py>=4.2.0",
    "markdownify>=0.13.0",
    "numpy>=1.24.0",
    "openai>=1.40.0",
    "pathspec>=0.12.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "sentence-transformers>=2.2.0",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/bgross/mdwiki"
Documentation = "https://github.com/bgross/mdwiki#readme"
Repository = "https://github.com/bgross/mdwiki.git"
Issues = "https://github.com/bgross/mdwiki/issues"

[project.scripts]
mdwiki = "mdwiki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdwiki"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["mdwiki"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use blind `pytest.raises(Exception)` to verify frozen-dataclass
# immutability (the specific exception type varies across Python versions).
# Tests also occasionally have unused loop variables for fixture seeding.
"tests/*.py" = ["B017", "B007"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=mdwiki --cov-report=term-missing"
markers = [
    "unit: fast unit tests (default)",
    "integration: integration tests touching the filesystem or sqlite",
    "slow: tests that take more than a second",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pypdf>=5.0.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.8",
]
