[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-consolidator"
version = "0.2.0"
description = "Intelligent consolidation and synthesis of multiple markdown files with overlapping content"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "markdown",
    "consolidation",
    "documentation",
    "knowledge-base",
    "ai-workflow",
    "deduplication",
    "synthesis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.25.0",
    "scipy>=1.11.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
embeddings = [
    "sentence-transformers>=2.0",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/markdown-consolidator"
Documentation = "https://github.com/YOUR_USERNAME/markdown-consolidator#readme"
Repository = "https://github.com/YOUR_USERNAME/markdown-consolidator.git"
Issues = "https://github.com/YOUR_USERNAME/markdown-consolidator/issues"

[project.scripts]
mdconsolidate = "markdown_consolidator.cli:main"
mdconsolidate-inventory = "markdown_consolidator.cli:inventory_cmd"
mdconsolidate-analyze = "markdown_consolidator.cli:analyze_cmd"
mdconsolidate-cluster = "markdown_consolidator.cli:cluster_cmd"
mdconsolidate-synthesize = "markdown_consolidator.cli:synthesize_cmd"
mdconsolidate-analyze-sections = "markdown_consolidator.cli:analyze_sections_cmd"
mdconsolidate-synthesize-manifest = "markdown_consolidator.cli:synthesize_manifest_cmd"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_consolidator"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["markdown_consolidator"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=markdown_consolidator --cov-report=term-missing"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.8",
]
