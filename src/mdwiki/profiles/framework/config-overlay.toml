# Framework profile config overlay.
#
# Tunes mdwiki for procedure / template / assessment / learning corpora.

[ingest]
# Frameworks have tightly interlinked artifacts; more candidates help the LLM
# update existing templates / cite existing assessments rather than creating
# duplicates.
candidate_top_k = 14

[profile]
name = "framework"

[profile.framework]
extra_page_kinds = ["procedure", "template", "assessment", "learning"]
# When set, every page write embeds previous_hash: in YAML frontmatter (the
# default in v1.2; this flag exists so a future user could explicitly opt
# out for compatibility with downstream tooling that doesn't expect frontmatter).
version_chain_enabled = true
